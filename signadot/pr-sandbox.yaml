# The sandbox a pull request gets. One per pull request, named after it, so
# anything that needs this pull request's sandbox can look it up by name instead
# of searching a list and choosing. That matters: a check that searches can pick
# another pull request's sandbox.
#
# The GitHub labels let Signadot link the sandbox to the pull request in its own
# UI. Signadot requires both together, and checks that the pull request exists.
#
# Usage:
#   signadot sandbox apply -f signadot/pr-sandbox.yaml \
#     --set cluster=<cluster> --set registry=signadot --set service=storefront --set image=<tag> \
#     --set repo=<owner/repo> --set pr=<number>
name: "pr-@{pr}"
spec:
  cluster: "@{cluster}"
  description: "boxoffice @{service} from pull request @{pr}"
  labels:
    demo: boxoffice
    signadot/github-repo: "@{repo}"
    signadot/github-pull-request: "@{pr}"
  # Long enough that a reader working through a tutorial does not lose the
  # sandbox midway and see a check fail for the wrong reason.
  ttl:
    duration: 8h
  forks:
    - forkOf:
        kind: Deployment
        namespace: boxoffice
        name: "@{service}"
      customizations:
        images:
          - image: "signadot/boxoffice-demo-@{service}:@{image}"
            container: "@{service}"
  defaultRouteGroup:
    endpoints:
      - name: storefront
        target: http://storefront.boxoffice.svc:8080
