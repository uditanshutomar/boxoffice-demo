# Builds every boxoffice image and publishes it to the GitHub Container
# Registry for this repository. It uses the token GitHub provides to the
# workflow, so nothing has to be configured by hand.
#
# Images are built for amd64 and arm64, because these tutorials get written on
# Apple Silicon and read on Linux.
name: Publish boxoffice images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: storefront
            tag: baseline
          - service: inventory
            tag: baseline
          - service: pricing
            tag: baseline
          - service: storefront
            tag: swallow-errors
          - service: storefront
            tag: safe-refactor
          - service: pricing
            tag: drop-fees
    steps:
      - uses: actions/checkout@v4

      # A lesson replaces one service's app.js. The baseline tag uses the file
      # as committed.
      - name: Apply the lesson, if this is one
        run: |
          if [ "${{ matrix.tag }}" != "baseline" ]; then
            cp "lessons/${{ matrix.tag }}/${{ matrix.service }}/app.js" \
               "pkg/${{ matrix.service }}/app.js"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/boxoffice-demo-${{ matrix.service }}:${{ matrix.tag }}
          provenance: false
